mlflow_uri: "http://localhost:5000"
experiment_name : "example_experiment"


instances:
  - mode: local
    workdir: "./test_data"           
    target_workdir: "./local_train"            # Where training and venv will l
    requirements: "requirements_local.txt"   # Pip requirements file
    pipelines: 
      train : 
        script: "mlflow_example.py" # Training script path
        args: [
          "--epoch", "50"
        ]


  - mode: local
    workdir: "./test_data"           
    target_workdir: "./local_train2"            # Where training and venv will l
    requirements: "requirements_local.txt"   # Pip requirements file
    pipelines: 
      train : 
        script: "mlflow_example.py" # Training script path
        args: [
          "--epoch", "30"
        ]

  - mode: remote
    ssh_config:
      hostname: "your.remote.server"
      username: "your"
      key_filename: "your_key.pem"
      password: null
    workdir: "./test_data"           
    target_workdir: "./remote_train"            # Where training and venv will l
    requirements: "requirements_remote.txt"   # Pip requirements file
    pipelines: 
      train : 
        script: "mlflow_example.py" # Training script path
        args: [
          "--epoch", "30"
        ]

